version: "3.8"

networks:
  gateway-network:
    driver: bridge

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:

services:
  # 1. PostgreSQL 
  db:
    image: postgres:17-alpine
    container_name: shared-db
    restart: always
    networks:
      - gateway-network
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c max_connections=100
    deploy:
      resources:
        limits:
          memory: 1G

  # 2. MinIO
  minio:
    image: quay.io/minio/minio:latest
    container_name: local-s3
    restart: always
    networks:
      - gateway-network
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: "https://${DOMAIN}/minio-console"
      MINIO_SERVER_URL: "https://${DOMAIN}/minio-api"
    command: server /data --console-address ":9001" --address ":9000"
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. ZITADEL Core
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: zitadel-api
    restart: always
    networks:
      - gateway-network
    depends_on:
      - db
    environment:
      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/zitadel?sslmode=disable"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_EXTERNALDOMAIN: "${DOMAIN}"
      ZITADEL_EXTERNALPORT: "443"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode disabled
    deploy:
      resources:
        limits:
          memory: 1G

  # 4. ZITADEL Login UI
  login-ui:
    image: ghcr.io/zitadel/zitadel-login:latest
    container_name: zitadel-login
    restart: always
    networks:
      - gateway-network
    depends_on:
      - zitadel
    environment:
      ZITADEL_SERVICE_USER_TOKEN: "${ZITADEL_SERVICE_USER_TOKEN}"
    deploy:
      resources:
        limits:
          memory: 256M

  # 5. Caddy Edge Proxy
  caddy:
    image: caddy:2-alpine
    container_name: edge-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - gateway-network
    depends_on:
      - zitadel
      - minio
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 256M